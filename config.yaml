    - username: "user"
      password: "user"

  # HTTP login paths to try
  http_login_paths:
    - "/login"
    - "/admin/login"
    - "/wp-login.php"
    - "/administrator"
    - "/auth/login"
    - "/user/login"

# --- CVE Database ---
cve_database:
  snapshot_path: "./data/cve_snapshot.json"
  auto_update: false            # Disabled - use local snapshot only

# --- Report Settings ---
report:
  company_name: "Security Audit Report"
  author: "VulnScanner Automated Tool"
  include_charts: true
  include_raw_data: true
  template_path: "./templates/report.html"
